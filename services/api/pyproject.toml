[project]
name = "cc-api"
version = "0.1.0"
description = "Contract Review Co-pilot backend: upload, extract, review, verify, search"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.143.3",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage==3.17.1",
    "google-genai==2.31.0",
    "pydantic==2.14.1",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "rapidfuzz==3.14.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
